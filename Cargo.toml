[workspace]
resolver = "2"
members = ["crates/common", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
possess-common = { path = "crates/common" }

[profile.release]
opt-level = 3
lto = true
strip = true
