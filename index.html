<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PossessApp</title>

  <!-- Theme, resolved before first paint to avoid a flash of the wrong one.
       Has to be inline and synchronous: the WebAssembly has not loaded yet. -->
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem('possess-theme');
      } catch (err) { /* storage blocked — fall through to the OS preference */ }

      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- The same stylesheets the JS app uses: this port changes the language,
       not the design, so every rule carries over unchanged. -->
  <link rel="stylesheet" href="/vendor/simplemde.min.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/icons.css" />
  <link rel="stylesheet" href="/css/editor.css" />
  <link rel="stylesheet" href="/css/preview.css" />
  <link rel="stylesheet" href="/css/images.css" />
  <link rel="stylesheet" href="/css/undo.css" />
  <link rel="stylesheet" href="/css/wikilinks.css" />
  <link rel="stylesheet" href="/css/vault.css" />
  <link rel="stylesheet" href="/css/scripts.css" />

  <!-- CodeMirror stays. editor-shim.js drives it and is the only JavaScript
       the Rust UI keeps; both load before the module that calls into them. -->
  <script src="/vendor/simplemde.min.js"></script>
  <script src="/js/editor-shim.js"></script>
</head>
<body>
  <!-- css/layout.css makes #app the flex row holding the sidebar and the main
       content, so the shell mounts inside it rather than into <body>. -->
  <div id="app"></div>

  <script type="module">
    import init from '/pkg/possess_ui.js';
    init();
  </script>
</body>
</html>
