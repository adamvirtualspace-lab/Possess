<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PossessApp</title>

  <!-- Theme, resolved before first paint to avoid a flash of the wrong one -->
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem('possess-theme');
      } catch (err) { /* storage blocked — fall through to the OS preference */ }

      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- SimpleMDE CSS (local vendor) -->
  <link rel="stylesheet" href="/vendor/simplemde.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/icons.css" />
  <link rel="stylesheet" href="/css/editor.css" />
  <link rel="stylesheet" href="/css/preview.css" />
  <link rel="stylesheet" href="/css/vault.css" />

  <!-- JS Libraries (loaded before our scripts) -->
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/simplemde.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><span>P</span></div>
        <span class="sidebar-title">PossessApp</span>
      </div>
      <button class="vault-btn" id="btn-vault">
        <svg class="vault-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        <span class="vault-btn-name" id="vault-name">notes</span>
        <span class="vault-btn-hint">Change</span>
      </button>
      <div class="sidebar-tools">
        <div class="search-row">
          <input type="search" id="file-search" spellcheck="false"
                 placeholder="Search notes..." aria-label="Search notes" />
        </div>
        <div class="tool-row">
          <button class="tool-btn" id="btn-new-note" title="New note">+ Note</button>
          <button class="tool-btn" id="btn-new-folder" title="New folder">+ Folder</button>
        </div>
      </div>

      <nav id="file-tree"></nav>
    </aside>

    <!-- Drag handle: sidebar ↔ main content -->
    <div class="resizer" id="sidebar-resizer" title="Drag to resize"></div>

    <!-- ── MAIN CONTENT ── -->
    <section class="main-content">
      <div class="top-bar">
        <span id="current-file-name">No file selected</span>
        <div class="btn-group">
          <button class="theme-btn" id="btn-theme" title="Switch theme"></button>
          <button class="btn active" id="btn-edit" title="Edit Mode">Edit</button>
          <button class="btn" id="btn-preview" title="Preview Mode">Preview</button>
        </div>
      </div>

      <div class="viewport">
        <textarea id="editor-container"></textarea>
        <!-- Drag handle: editor ↔ preview, only visible in side-by-side -->
        <div class="split-resizer" id="split-resizer" title="Drag to resize"></div>
        <div id="preview-panel" class="markdown-preview"></div>
      </div>
    </section>
  </div>

  <!-- ── SIDEBAR CONTEXT MENU ── -->
  <div class="context-menu" id="context-menu" hidden></div>

  <!-- ── VAULT PICKER ── -->
  <div class="modal-backdrop" id="vault-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="vault-modal-title">
      <div class="modal-header">
        <h2 id="vault-modal-title">Select vault folder</h2>
        <button class="modal-close" id="vault-close" title="Close">&times;</button>
      </div>

      <div class="modal-body">
        <div class="vault-path-row">
          <input type="text" id="vault-path-input" spellcheck="false"
                 placeholder="Type or paste a folder path" />
          <button class="btn" id="vault-go">Go</button>
        </div>

        <div class="vault-drives" id="vault-drives" hidden></div>
        <div class="vault-list" id="vault-list"></div>
        <p class="vault-error" id="vault-error" hidden></p>
      </div>

      <div class="modal-footer">
        <button class="btn" id="vault-cancel">Cancel</button>
        <button class="btn active" id="vault-select">Use this folder</button>
      </div>
    </div>
  </div>

  <!-- Application Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/editor.js"></script>
  <script src="/js/resizer.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/vault.js"></script>
  <script src="/js/notes.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
