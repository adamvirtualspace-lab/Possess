[package]
name = "possess-ui"
version.workspace = true
edition.workspace = true
description = "PossessApp browser UI (Leptos, WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
possess-common = { workspace = true }
possess-markdown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-storage = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Window", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlTextAreaElement", "DomTokenList", "CssStyleDeclaration", "DomRect",
  "Event", "MouseEvent", "KeyboardEvent", "CustomEvent", "CustomEventInit",
  "Storage", "console",
]
